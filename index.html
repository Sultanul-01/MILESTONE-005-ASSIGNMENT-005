<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GitHub Issues Tracker</title>
    <!-- css -->
     <link rel="stylesheet" href="/Style/style.css">
    <!-- icon link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- tailwind link -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100">
    <!-- ================= LOGIN PAGE ================= -->

    <div id="loginPage" class="min-h-screen flex items-center justify-center">
      <div class="bg-white p-10 rounded-xl shadow-lg w-[380px]">
        <div class="flex flex-col items-center mb-6">
          <img class="w-20" src="/assets/github-logo.png" alt="" />
          <h1 class="text-2xl font-bold">GitHub Issues Tracker</h1>
          <p class="text-gray-500">Sign in to manage your issues</p>
        </div>

        <form id="loginForm" class="space-y-4">
          <p>Username</p>
          <input
            id="username"
            type="text"
            placeholder="Enter Username"
            class="w-full border p-3 rounded-lg"
          />

          <p class="text-xs text-purple-600">Default: admin</p>
          <p>Password</p>
          <input
            id="password"
            type="password"
            placeholder="Enter Password"
            class="w-full border p-3 rounded-lg"
          />

          <p class="text-xs text-purple-600">Default: admin123</p>

          <button class="w-full bg-[#4A00FF] text-white py-3 rounded-lg">
            Sign In
          </button>
          <div class="flex items-center">
            <hr class="grow border-gray-300" />
            <span class="px-3 text-gray-500">OR</span>
            <hr class="grow border-gray-300" />
          </div>
          <div class="text-center space-y-2.5">
            <p class="text-gray-500">Demo Credentials:</p>
            <p class="font-bold">
              Username: admin <br />
              Password: admin123
            </p>
          </div>
        </form>
      </div>
    </div>
    <!-- ================= DASHBOARD ================= -->

    <div id="dashboard" class="hidden">
      <!-- NAVBAR -->

      <div class="bg-white shadow">
        <div class="max-w-7xl mx-auto flex justify-between items-center p-4">
          <div class="flex gap-1.5 items-center">
            <img class="w-10" src="/assets/github-logo.png" alt="" />
            <h1 class="hidden sm:block font-bold sm:text-lg">
              GitHub Issues Tracker
            </h1>
          </div>

          <div class="flex items-center gap-2">
            <i class="fa-solid fa-magnifying-glass hidden sm:inline"></i>
            <input
              id="searchInput"
              type="text"
              placeholder="Search issues..."
              class="border px-3 py-2 rounded-lg"
            />

            <button
              id="searchBtn"
              class="bg-[#4A00FF] text-white px-4 py-2 rounded-lg"
            >
              Search
            </button>
          </div>
        </div>
      </div>
    <script src="/Script/script.js"></script>
  </body>
</html>
